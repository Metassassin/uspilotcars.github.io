      label: Highlighted background (Expanded Bold)
      type: boolean
      default: false
      description: The paid upgrade that colours this listing's row so it stands out.
    - name: badges
      label: Other badges
      type: string
      list: true
      description: Anything outside the four services, one per line, e.g. WITPAC or NY Cert.
    - name: description
      label: Short tagline (optional)
      type: text
      options:
        maxlength: 400
    - name: priority
      label: Order within the same city
      type: number
      default: 100
      description: Only matters between companies in the same city. Lower number shows first.
      options:
        min: 1
        max: 999
    - name: pinned
      label: Pin to top of the state list
      type: boolean
      default: false
      description: Paid upgrade. Puts this listing above every city in the company list on each of its state pages,
        marked "Top listing". Pinned listings are ordered by package, then by the order number above.
    - name: active
      label: Show on the website
      type: boolean
      default: true
      description: Turn off to hide this listing without deleting it.
    - name: startDate
      label: Start showing on (optional)
      type: date
      default: ''
      options:
        format: yyyy-MM-dd
    - name: endDate
      label: Last day shown (optional)
      type: date
      default: ''
      description: When a customer cancels, set this to the last day they paid for. The listing disappears by itself
        the day after.
      options:
        format: yyyy-MM-dd
    - name: notes
      label: Private notes (never shown on the website)
      type: text
  - name: hotels
    label: Hotels
    type: collection
    path: content/hotels
    format: json
    filename: '{name}-{city}.json'
    view:
      primary: name
      fields:
      - name
      - city
      - state
      - active
      - endDate
      sort:
      - name
      - city
      - state
      search:
      - name
      - city
      default:
        sort: name
        order: asc
    fields:
    - name: name
      label: Hotel name
      type: string
      required: true
    - name: state
      label: State
      component: state_list
      required: true
    - name: city
      label: City
      type: string
      required: true
      description: The hotel appears among the pilot car companies for this city, so spell it the same way they
        do.
    - name: address
      label: Street address
      type: string
    - name: phone
      label: Phone
      type: string
    - name: website
      label: Website (optional)
      type: string
    - name: notes
      label: Highlights
      type: string
      list: true
      description: One per line, e.g. "Pet friendly", "Pilot car rate $45".
    - name: active
      label: Show on the website
      type: boolean
      default: true
    - name: endDate
      label: Last day shown (optional)
      type: date
      default: ''
      options:
        format: yyyy-MM-dd
    - name: privateNotes
      label: Private notes (never shown on the website)
      type: text
  - name: hotel_chains
    label: Hotel chains (Find a Hotel page)
    type: file
    path: content/hotel_chains.json
    format: json
    fields:
    - name: chains
      label: Chains
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{name}'
      fields:
      - name: name
        label: Chain name
        type: string
        required: true
      - name: phone
        label: Reservation phone
        type: string
      - name: website
        label: Website
        type: string
      - name: note
        label: Tag (optional)
        type: string
        description: Short tag shown next to the name, e.g. "Special rate for pilot car drivers".
      - name: active
        label: Show on the website
        type: boolean
        default: true
  - name: regulations
    label: Regulations
    type: collection
    path: content/regulations
    format: json
    filename: '{region}.json'
    view:
      primary: region
      fields:
      - region
      - lastVerified
      sort:
      - region
      - lastVerified
      default:
        sort: region
        order: asc
    fields:
    - name: region
      label: State / province
      component: state_list
      required: true
    - name: body
      label: Regulations
      type: rich-text
      description: Use the heading button for sections like "When Permit Is Needed" and bullet points for each rule.
        Paste links as normal.
      options:
        format: html
        media: false
    - name: lastVerified
      label: Last checked against the state's current rules
      type: date
      default: ''
      description: Shown to visitors. Leave empty until someone has re-checked this state.
      options:
        format: yyyy-MM-dd
    - name: sourceUrl
      label: Official state source (optional)
      type: string
      description: Link to the state DOT permit page, e.g. https://www.txdot.gov
    - name: notes
      label: Private notes (never shown on the website)
      type: text
- name: services
  label: Design Services page
  type: file
  path: content/services.json
  format: json
  fields:
  - name: enabled
    label: Show this page on the website
    type: boolean
    default: true
  - name: inquiryEmail
    label: Email address that receives inquiries
    type: string
    description: The form starts working once a real address is here. The first message sends a confirmation email
      to this address -- click the link in it once to switch the form on.
  - name: formAlias
    label: Private form code (optional)
    type: string
    description: After confirming, FormSubmit can give you a random code to use instead of your email, so spammers
      can't read your address from the page. Paste it here.
  - name: navLabel
    label: Menu label
    type: string
  - name: headline
    label: Page headline
    type: string
  - name: intro
    label: Introduction
    type: text
  - name: relationshipNotice
    label: Note shown at the top
    type: text
    description: Makes clear this is a separate, paid service.
  - name: services
    label: Services offered
    type: object
    list: true
    fields:
    - name: title
      label: Service
      type: string
    - name: description
      label: Short description
      type: text
    - name: startingPrice
      label: Starting price (optional)
      type: string
