# =====================================================================
# Pages CMS setup for uspilotcars.com
#
# This file decides what appears in the editor at app.pagescms.org.
# Grandma never sees or edits it.
#
# Every Save in the editor saves a small file to GitHub; Cloudflare then
# rebuilds the website automatically. Changes are live in ~2 minutes.
# =====================================================================

media:
  input: assets/images/advertisements
  output: /assets/images/advertisements
  rename: safe
  categories: [image]

settings:
  # Keep any extra details stored in an entry (old IDs, email, etc.)
  # even though the form doesn't show them.
  content:
    merge: true
  commit:
    templates:
      create: "Added {filename} (via Pages CMS)"
      update: "Updated {filename} (via Pages CMS)"
      delete: "Removed {filename} (via Pages CMS)"

components:
  state_list:
    type: select
