content:
- name: advertising
  label: Advertising
  type: group
  items:
  - name: ads
    label: Ads
    type: collection
    path: content/ads
    format: json
    filename: '{businessName}.json'
    view:
      primary: businessName
      fields:
      - businessName
      - active
      - endDate
      sort:
      - businessName
      - endDate
      search:
      - businessName
      - phone
      default:
        sort: businessName
        order: asc
    fields:
    - name: businessName
      label: Advertiser
      type: string
      required: true
      description: The company. Its name is coloured and linked automatically in strips and listings.
    - name: phone
      label: Phone
      type: string
    - name: website
      label: Website (optional)
      type: string
    - name: placements
      label: Where this ad appears
      type: block
      list: true
      blockKey: type
      blocks:
      - name: nationwide
        label: Nationwide Sponsor (top of every page)
        fields:
        - name: image
          label: Ad picture
          type: image
          required: true
          description: The whole ad, as one picture. Shown on every page of the site.
